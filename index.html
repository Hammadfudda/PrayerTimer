<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Prayer Times</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png" />
  <meta name="apple-mobile-web-app-status-bar" content="#0f0f1a" />
  <meta name="theme-color" content="#0f0f1a" />
  <link rel="icon" href="./assets/islamic.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Error Modal -->
  <div id="errorModal" class="modal-overlay modal-hidden">
    <div class="modal-card">
      <div class="modal-icon">⚠️</div>
      <h3>City Not Found</h3>
      <p>Prayer times are not available for this city. Please check spelling and try again.</p>
      <button onclick="closeError()" class="btn-retry">Try Again</button>
    </div>
  </div>

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo-wrap">
        <img src="./assets/islamic.png" class="header-logo" alt="logo">
      </div>
      <div class="header-text">
        <span class="app-name">PrayerTime</span>
        <span class="city-badge" id="cityBadge"></span>
      </div>
    </div>
    <div class="header-right">
      <!-- Search bar — hidden by default -->
      <div class="search-expand" id="searchExpand">
        <input type="text" id="cityInput" class="search-input" placeholder="Enter city..." />
        <div class="spinner" id="spinnerChecker"></div>
        <button class="btn-go" id="searchButton" onclick="SearchCityName()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
          </svg>
        </button>
      </div>
      <!-- Toggle icon — always visible -->
      <button class="search-icon-btn" id="searchToggleBtn" onclick="toggleSearch()">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main class="app-main">

    <!-- Hero Card -->
    <div class="hero-card">
      <div class="hero-glow"></div>
      <div class="hero-content">
        <div class="prayer-label" id="currentPrayerLabel">—</div>
        <div class="prayer-time" id="currentPrayerTime">—</div>
        <div class="logo-circle">
          <img src="./assets/islamic.png" alt="Masjid">
        </div>
        <div id="remainingBlock">
          <div class="rem-hint">Search a city to begin</div>
        </div>
      </div>
    </div>

    <!-- Right Panel -->
    <div class="right-panel">
      <div class="date-row">
        <span id="liveDate"></span>
        <span class="dot">·</span>
        <span id="liveClock"></span>
      </div>
      <div class="prayers-grid" id="prayerGrid"></div>
      <div class="empty-state" id="emptyState">
        <div>🔍</div>
        <p>Search your city to see prayer times</p>
      </div>
    </div>

  </main>

  <script src="reminder.js"></script>
</body>
</html>
